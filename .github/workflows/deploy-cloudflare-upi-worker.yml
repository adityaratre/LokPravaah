name: Deploy LokPravaah Cloudflare UPI Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-upi-worker/**'
      - '.github/workflows/deploy-cloudflare-upi-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-upi-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker tooling
        run: npm install
      - name: Run gateway tests
        run: npm test
      - name: Validate Cloudflare bundle
        run: npm run check
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
