name: Deploy LokPravaah Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/janwatch-ai/**'
      - 'supabase/functions/donation-webhook/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
      - 'LokPravaah-main/supabase/functions/janwatch-ai/**'
      - 'LokPravaah-main/supabase/functions/donation-webhook/**'
      - 'LokPravaah-main/supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets and locate project
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [[ -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_PROJECT_ID"
            exit 1
          fi

          if [[ -f "supabase/config.toml" ]]; then
            echo "DEPLOY_DIR=." >> "$GITHUB_ENV"
            echo "Found Supabase configuration at repository root."
          elif [[ -f "LokPravaah-main/supabase/config.toml" ]]; then
            echo "DEPLOY_DIR=LokPravaah-main" >> "$GITHUB_ENV"
            echo "Found Supabase configuration in LokPravaah-main/."
          else
            echo "Cannot find supabase/config.toml. Extract the full project into the repository root."
            exit 1
          fi

      - name: Deploy AI function
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/$DEPLOY_DIR"
          supabase functions deploy janwatch-ai --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy signed donation webhook
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/$DEPLOY_DIR"
          supabase functions deploy donation-webhook --project-ref "$SUPABASE_PROJECT_ID"
