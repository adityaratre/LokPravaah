name: Build and deploy LokPravaah Cloudflare Worker assets

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zfcvfkchttpisuizndur.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_lcKMw3ukzSeGhUW6THNsLw_JMsATwJX
          VITE_SITE_URL: https://lokpravaah.online
          VITE_DONATION_GATEWAY_PORTAL_URL: https://lokpravaah.online
          VITE_DONATION_GATEWAY_API_URL: https://lokpravaah.online
          VITE_DONATION_MERCHANT_KEY: '00000000-0000-0000-0000-000000000001'

      - name: Verify built static assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -type f | grep -q .
          echo "Frontend build output is ready in dist/."

      - name: Validate Worker static-assets deployment (dry run)
        run: npx --yes wrangler@4 deploy --name lokpravaah --assets ./dist --compatibility-date=2026-10-19 --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy frontend to the existing production Worker
        run: npx --yes wrangler@4 deploy --name lokpravaah --assets ./dist --compatibility-date=2026-10-19
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production website assets and UPI gateway
        shell: bash
        run: |
          set -euo pipefail
          html=""
          code="000"
          for attempt in {1..12}; do
            result="$(curl --silent --show-error --max-time 15 --write-out 'HTTPSTATUS:%{http_code}' https://lokpravaah.online/ || true)"
            code="${result##*HTTPSTATUS:}"
            html="${result%HTTPSTATUS:*}"
            if [ "$code" = "200" ] && printf '%s' "$html" | grep -q 'id="root"'; then
              break
            fi
            sleep 3
          done
          if [ "$code" != "200" ] || ! printf '%s' "$html" | grep -q 'id="root"'; then
            echo "::error::Production homepage did not return the expected React app (HTTP $code)."
            exit 1
          fi

          asset_path="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -n 1 | cut -d '"' -f 2 || true)"
          if [ -z "$asset_path" ]; then
            echo "::error::Production homepage did not reference a JavaScript bundle."
            exit 1
          fi
          asset_code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "https://lokpravaah.online$asset_path" || true)"
          if [ "$asset_code" != "200" ]; then
            echo "::error::Production JavaScript bundle was not available (HTTP $asset_code): $asset_path"
            exit 1
          fi
          echo "Production homepage and JavaScript bundle are responding."

          health_result="$(curl --silent --show-error --max-time 15 --write-out 'HTTPSTATUS:%{http_code}' https://lokpravaah.online/health || true)"
          health_code="${health_result##*HTTPSTATUS:}"
          health_body="${health_result%HTTPSTATUS:*}"
          if [ "$health_code" != "200" ] || ! printf '%s' "$health_body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s);process.exit(v.status==='UP'&&v.checks?.database&&v.checks?.receivingVpa?0:1)}catch{process.exit(1)}})"; then
            echo "::error::UPI gateway health check failed (HTTP $health_code). Safe diagnostic response:"
            printf '%s\n' "$health_body"
            exit 1
          fi
          echo "UPI gateway remains healthy; database and receiver configuration are reachable."
