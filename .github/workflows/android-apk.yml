name: Build LokPravaah Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "src/App.tsx"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # GitHub-hosted runners are ephemeral. Cache the Android debug signing key so
      # successive debug APKs can update the installed app instead of conflicting.
      - name: Restore stable debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lokpravaah-android-debug-signing-v1
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Run Android unit tests and build debug APK
        env:
          SUPABASE_URL: https://zfcvfkchttpisuizndur.supabase.co
          # Publishable/anon client key only. Never provide a service-role key to this workflow.
          SUPABASE_ANON_KEY: sb_publishable_lcKMw3ukzSeGhUW6THNsLw_JMsATwJX
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug
      - name: Rename installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/LokPravaah.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lokpravaah-android-apk
          path: android/app/build/outputs/apk/debug/LokPravaah.apk
          if-no-files-found: error
          retention-days: 14
