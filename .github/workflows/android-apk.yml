name: Build LokPravaah Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "src/App.tsx"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      # This is a development/debug signing key only. Release signing must use a private GitHub secret.
      # Pin the identity in the repository so successive test APKs don't randomly conflict on update.
      - name: Restore pinned debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode android/debug-signing.keystore.base64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"
      - name: Run Android unit tests and build debug APK
        env:
          SUPABASE_URL: https://zfcvfkchttpisuizndur.supabase.co
          # Publishable/anon client key only. Never provide a service-role key to this workflow.
          SUPABASE_ANON_KEY: sb_publishable_lcKMw3ukzSeGhUW6THNsLw_JMsATwJX
        run: gradle --no-daemon --no-build-cache -p android clean :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and record signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/app/build/outputs/apk/debug/SIGNING-CERTIFICATE.txt
          echo
          echo "Certificate fingerprint report saved with the APK artifact."
      - name: Rename installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/LokPravaah.apk
      - name: Upload APK and signing diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lokpravaah-android-apk
          path: |
            android/app/build/outputs/apk/debug/LokPravaah.apk
            android/app/build/outputs/apk/debug/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 14
