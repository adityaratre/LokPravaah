name: LokPravaah Final Android Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore the existing CI signing identity
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode android/debug-signing.keystore.base64 > android/debug-signing.keystore
          chmod 600 android/debug-signing.keystore
          keytool -list -v -keystore android/debug-signing.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"
      - name: Reuse the public client key configured in the existing Android workflow
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(sed -n 's/^[[:space:]]*SUPABASE_ANON_KEY: //p' .github/workflows/android-apk.yml | head -n 1)"
          test -n "$KEY"
          echo "SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Run tests and build release APK
        env:
          SUPABASE_URL: https://zfcvfkchttpisuizndur.supabase.co
        run: gradle --no-daemon --no-build-cache -p android clean :app:testDebugUnitTest :app:assembleRelease
      - name: Verify package, version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/app/build/outputs/apk/release/SIGNING-CERTIFICATE.txt
          "$AAPT" dump badging "$APK" | grep -F "package: name='online.lokpravaah.app' versionCode='9' versionName='1.2.3'"
          cp "$APK" android/app/build/outputs/apk/release/LokPravaah-1.2.3.apk
      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: lokpravaah-final-release-1.2.3
          path: |
            android/app/build/outputs/apk/release/LokPravaah-1.2.3.apk
            android/app/build/outputs/apk/release/SIGNING-CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 14
